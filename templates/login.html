<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HR Login — AI Recruitment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1a365d,#2b6cb0);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.login-card{
  background:white;border-radius:20px;padding:40px;
  width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo .icon{
  width:64px;height:64px;background:linear-gradient(135deg,#1a365d,#2b6cb0);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 12px;
}
.login-logo h1{font-size:20px;font-weight:800;color:#1a365d;}
.login-logo p{font-size:13px;color:#718096;margin-top:4px;}
.field{margin-bottom:18px;}
.field label{font-size:12px;font-weight:700;color:#4a5568;display:block;margin-bottom:6px;}
.field input{
  width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;
  border-radius:10px;font-size:14px;outline:none;transition:border 0.2s;
}
.field input:focus{border-color:#3182ce;}
.btn-login{
  width:100%;padding:14px;background:linear-gradient(135deg,#3182ce,#1a365d);
  color:white;border:none;border-radius:10px;font-size:15px;
  font-weight:700;cursor:pointer;margin-top:8px;transition:opacity 0.2s;
}
.btn-login:hover{opacity:0.9;}
.error{
  background:#fed7d7;color:#822727;padding:10px 14px;
  border-radius:8px;font-size:13px;margin-bottom:16px;
}
.hint{
  background:#ebf8ff;color:#1a365d;padding:12px 14px;
  border-radius:8px;font-size:12px;margin-top:16px;text-align:center;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="icon">🤖</div>
    <h1>HR Admin Login</h1>
    <p>Sri Krishna Engineering — AI Recruitment System</p>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="error">❌ {{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn-login">🔐 Login to Dashboard</button>
  </form>

  <div class="hint">
    Default credentials<br>
    <strong>Username:</strong> admin &nbsp;|&nbsp; <strong>Password:</strong> admin123
  </div>
</div>
</body>
</html>
